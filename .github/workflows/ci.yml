# Lint, unit tests and the pre-publication scan on every push and pull request. No secrets and no competition data are used:
# the tests run on synthetic rows (tests/, baseline/tests/). The environment is uv.lock with the dev group (pytest, ruff 0.17.0),
# Python from .python-version; it is created outside the checkout so that the release scan reads the repository only.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run --frozen ruff check .
      - name: Pytest
        run: uv run --frozen pytest -q
      - name: Release scan
        run: bash tools/check_release.sh .
